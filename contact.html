<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jester John Sivila | Contact</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">Jester<span>Sivila</span></a>
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="skill.html">Skills</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
        <li><button id="themeToggle" class="theme-btn"><i class="fas fa-moon"></i></button></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Get In Touch</h1>
    <div class="grid-2">
      <div class="card">
        <h3><i class="fas fa-paper-plane"></i> Send a Message</h3>
        <form id="contactForm" class="contact-form" novalidate>
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Your name">
            <div class="error" id="nameError"></div>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">
            <div class="error" id="emailError"></div>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="Your message..."></textarea>
            <div class="error" id="messageError"></div>
          </div>
          <button type="submit" class="btn">Send Message</button>
          <p id="formSuccess" class="success"></p>
        </form>
      </div>

      <div class="card">
        <h3><i class="fas fa-address-card"></i> Contact Info</h3>
        <p><i class="fas fa-envelope"></i> jesterjohnlocson@gmail.com</p>
        <p><i class="fas fa-phone"></i> +63 917 123 4567</p>
        <p><i class="fas fa-map-marker-alt"></i> Makati, City</p>
        <div class="social-links" style="justify-content:flex-start; margin-top:1.5rem;">
          <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
          <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
          <a href="mailto:jesterjohnlocson@gmail.com" target="_blank"><i class="fas fa-envelope"></i></a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="social-links">
      <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
      <a href="mailto:jesterjohnlocson@gmail.com" target="_blank"><i class="fas fa-envelope"></i></a>
    </div>
    <p>© 2026 Jester John Sivila. All rights reserved.</p>
  </footer>

  <button id="scrollTop" class="scroll-top"><i class="fas fa-arrow-up"></i></button>
  <script src="script.js"></script>
</body>
</html>
