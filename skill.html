<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jester John Sivila | Skills</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    .skill-item {
      animation: skillFadeIn 0.6s ease both;
    }

    .skill-item:nth-child(2) { animation-delay: 0.1s; }
    .skill-item:nth-child(3) { animation-delay: 0.2s; }
    .skill-item:nth-child(4) { animation-delay: 0.3s; }

    @keyframes skillFadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .skill-item {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">Jester<span>Sivila</span></a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
        <i class="fas fa-bars"></i>
      </button>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="skill.html" class="active">Skills</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li>
          <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">
            <i class="fas fa-moon"></i>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">My Skills</h1>

    <div class="grid-4">
      <div class="skill-item" data-level="95">
        <i class="fab fa-html5"></i>
        <h4>HTML5</h4>
        <div class="skill-bar"><div class="skill-progress"></div></div>
      </div>

      <div class="skill-item" data-level="88">
        <i class="fab fa-js"></i>
        <h4>JavaScript</h4>
        <div class="skill-bar"><div class="skill-progress"></div></div>
      </div>

      <div class="skill-item" data-level="90">
        <i class="fab fa-git-alt"></i>
        <h4>Git</h4>
        <div class="skill-bar"><div class="skill-progress"></div></div>
      </div>

      <div class="skill-item" data-level="85">
        <i class="fab fa-adobe"></i>
        <h4>Adobe Illustrator</h4>
        <div class="skill-bar"><div class="skill-progress"></div></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="social-links">
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <i class="fab fa-facebook-f"></i>
      </a>
      <a href="mailto:jesterjohnlocson@gmail.com" aria-label="Email">
        <i class="fas fa-envelope"></i>
      </a>
    </div>
    <p>© 2026 Jester John Sivila. All rights reserved.</p>
  </footer>

  <button id="scrollTop" class="scroll-top" aria-label="Scroll to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <script src="script.js"></script>
</body>
</html>
